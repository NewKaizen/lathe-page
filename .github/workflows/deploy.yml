name: Test and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run responsive and interaction tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build the Pages site
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for the repository URL
        run: npm run build -- --base-href /lathe-page/

      - name: Keep Angular routes refreshable
        run: cp dist/lathe-page/browser/index.html dist/lathe-page/browser/404.html

      - name: Transfer site to the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-site
          path: dist/lathe-page/browser

  deploy:
    name: Publish gh-pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tested site
        uses: actions/download-artifact@v4
        with:
          name: github-pages-site
          path: dist/lathe-page/browser

      - name: Publish tested build to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/lathe-page/browser
          publish_branch: gh-pages
